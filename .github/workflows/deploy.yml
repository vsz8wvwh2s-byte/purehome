name: Deploy PureHome

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with retry
        run: |
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency installation failed after 3 attempts" >&2
              exit 1
            fi
            echo "Install attempt $attempt failed; retrying shortly..." >&2
            sleep 10
          done
      - run: npm test
      - run: npm run build
      - name: Smoke test homepage asset references
        run: node scripts/verify-pages-assets.mjs
      - name: Verify production bundle
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          if [ -n "$(find dist -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) -print -quit)" ]; then
            echo "Environment files or private key files must not be published" >&2
            exit 1
          fi
          if [ -n "$(find dist -type d \( -name '.git' -o -name 'node_modules' -o -name '.github' \) -print -quit)" ]; then
            echo "Development or repository directories must not be published" >&2
            exit 1
          fi
          if [ -n "$(find dist -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.log' \) -print -quit)" ]; then
            echo "TypeScript source and log files must not be published" >&2
            exit 1
          fi
          if [ -n "$(find dist -type f \( -name '.npmrc' -o -name '.netrc' -o -name '.htpasswd' -o -name 'package.json' -o -name 'package-lock.json' -o -name 'pnpm-lock.yaml' -o -name 'yarn.lock' \) -print -quit)" ]; then
            echo "Package manifests, lockfiles, or credential configuration must not be published" >&2
            exit 1
          fi
          if [ -n "$(find dist -type l -print -quit)" ]; then
            echo "Symbolic links are not permitted in published assets" >&2
            exit 1
          fi
          if [ -z "$(find dist/assets -maxdepth 1 -type f -name '*.js' -size +0c -print -quit)" ]; then
            echo "Production JavaScript bundle is missing" >&2
            exit 1
          fi
          if [ -n "$(find dist -type f -name '*.map' -print -quit)" ]; then
            echo "Source maps must not be published to GitHub Pages" >&2
            exit 1
          fi
          if grep -R -q -E 'sk_(live|test)_[A-Za-z0-9]+|rk_(live|test)_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|sb_secret_[A-Za-z0-9]+|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9._-]+' dist; then
            echo "Potential secret key detected in published assets" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
